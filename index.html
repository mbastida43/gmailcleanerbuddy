<style>

/* =========================================================
   DESIGN TOKENS
========================================================= */
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --line:#e6eaf0;
  --text:#172033;
  --muted:#667085;
  --blue:#4285f4;
  --green:#34a853;
  --red:#ea4335;
  --yellow:#fbbc05;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(66,133,244,.12), transparent 25%),
    radial-gradient(circle at top right, rgba(234,67,53,.10), transparent 25%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* =========================================================
   LAYOUT
========================================================= */
.container{
  width:min(1100px,100%);
  margin:auto;
  padding:30px 18px;
}

/* =========================================================
   TOPBAR
========================================================= */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  gap:14px;
  align-items:center;
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  background:linear-gradient(135deg,var(--blue),var(--green),var(--yellow),var(--red));
  display:grid;
  place-items:center;
  color:white;
  font-size:26px;
  font-weight:900;
  box-shadow:0 16px 40px rgba(66,133,244,.25);
  flex-shrink:0;
}

h1{
  font-size:34px;
  font-weight:900;
}

.subtitle{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}

/* =========================================================
   LANGUAGE SWITCHER
========================================================= */
.langs{
  display:flex;
  gap:10px;
}

.lang-btn{
  border:1px solid var(--line);
  background:white;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  font-weight:800;
  font-size:13px;
  font-family:inherit;
  transition:.2s;
}

.lang-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.lang-btn.active{
  background:#172033;
  color:white;
  border-color:#172033;
}

/* =========================================================
   CARD
========================================================= */
.card{
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(16,24,40,.08);
}

/* =========================================================
   AUTH
========================================================= */
.auth{
  padding:34px;
}

.auth h2{
  font-size:24px;
  margin-bottom:8px;
}

.auth p{
  color:var(--muted);
  line-height:1.6;
}

.input-group{
  margin-top:24px;
}

.input-group label{
  display:block;
  margin-bottom:8px;
  font-size:13px;
  font-weight:800;
}

.emailbox{
  display:flex;
  align-items:center;
  border:2px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:white;
}

.emailbox:focus-within{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(66,133,244,.12);
}

.emailbox input{
  flex:1;
  border:none;
  outline:none;
  padding:16px;
  font-size:15px;
  font-weight:700;
  font-family:inherit;
  background:transparent;
}

.suffix{
  padding-right:16px;
  color:var(--red);
  font-weight:900;
}

.error{
  margin-top:8px;
  color:var(--red);
  font-size:12px;
  display:none;
  font-weight:700;
}

.error.show{
  display:block;
}

/* =========================================================
   BUTTONS
========================================================= */
.btn{
  border:none;
  border-radius:16px;
  padding:15px 18px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
  font-size:14px;
  font-family:inherit;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.btn.primary{
  background:#172033;
  color:white;
  width:100%;
  margin-top:24px;
}

.secondary{
  background:white;
  border:1px solid var(--line);
  color:var(--text);
}

.danger{
  background:linear-gradient(135deg,#ea4335,#d92d20);
  color:white;
}

.green{
  background:linear-gradient(135deg,#34a853,#12b76a);
  color:white;
}

/* =========================================================
   RESULTS
========================================================= */
.results{
  display:none;
}

.panel-head{
  padding:26px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}

.panel-head h2{
  font-size:26px;
}

.panel-head p{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

/* =========================================================
   STATS
========================================================= */
.stats{
  padding:24px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:28px;
  font-weight:900;
}

.stat span{
  font-size:11px;
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}

/* =========================================================
   CONTENT GRID
========================================================= */
.content{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:18px;
  padding:0 24px 24px;
}

/* =========================================================
   OFFENDERS LIST
========================================================= */
.list{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
}

.list-title{
  padding:18px;
  border-bottom:1px solid var(--line);
  font-weight:900;
  font-size:14px;
}

.offender{
  padding:16px 18px;
  border-bottom:1px solid #f2f4f7;
  display:grid;
  grid-template-columns:50px 1fr 110px;
  gap:14px;
  align-items:center;
  transition:background .15s;
}

.offender:last-child{
  border-bottom:none;
}

.offender:hover{
  background:#fafbfc;
}

.rank{
  width:38px;
  height:38px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-weight:900;
  background:#f2f4f7;
  font-size:14px;
}

.r1{ background:linear-gradient(135deg,#ea4335,#ff6b6b); color:white; }
.r2{ background:linear-gradient(135deg,#fbbc05,#ffe070); }
.r3{ background:linear-gradient(135deg,#4285f4,#6ea8fe); color:white; }

.domain{
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.cat{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.count{
  text-align:right;
  font-weight:900;
}

.count small{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}

.bar{
  grid-column:2/4;
  height:8px;
  background:#f2f4f7;
  border-radius:999px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--blue),var(--green));
  width:0;
  transition:width 1s ease;
}

/* =========================================================
   SIDEBAR
========================================================= */
.side{
  display:grid;
  gap:16px;
  align-content:start;
}

.box{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
}

.box h3{
  margin-bottom:10px;
  font-size:15px;
}

.box p,
.box li{
  color:var(--muted);
  line-height:1.6;
  font-size:13px;
}

.box ul{
  padding-left:18px;
}

.secret-input{
  width:100%;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  font-size:14px;
  font-weight:700;
  font-family:inherit;
  outline:none;
  transition:.2s;
}

.secret-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(66,133,244,.12);
}

.secret-output{
  margin-top:10px;
  border-radius:14px;
  background:#f8fafc;
  border:1px dashed #cfd6e4;
  padding:12px;
  word-break:break-all;
  font-size:11px;
  font-family:monospace;
  color:#344054;
  min-height:90px;
  overflow:auto;
}

/* =========================================================
   CLEANED LOG ITEM
========================================================= */
.cleaned-item{
  border:1px solid var(--line);
  padding:10px;
  border-radius:14px;
  margin-bottom:8px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.cleaned-item strong{
  font-weight:800;
}

.cleaned-removed{
  color:var(--green);
  font-weight:900;
  white-space:nowrap;
}

/* =========================================================
   TOAST
========================================================= */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(90px);
  background:#172033;
  color:white;
  padding:14px 22px;
  border-radius:16px;
  font-weight:900;
  font-size:14px;
  transition:.3s;
  opacity:0;
  pointer-events:none;
  z-index:9999;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media(max-width:900px){
  .stats{ grid-template-columns:repeat(2,1fr); }
  .content{ grid-template-columns:1fr; }
  h1{ font-size:26px; }
}

@media(max-width:480px){
  .stats{ grid-template-columns:1fr 1fr; }
  .panel-head{ flex-direction:column; }
  .topbar{ flex-direction:column; align-items:flex-start; }
}

</style>
</head>

<div class="container">

  <!-- ===================== TOPBAR ===================== -->
  <div class="topbar">

    <div class="brand">

      <div>

      </div>

    <div class="langs" id="langSwitcher">
      <button class="lang-btn active" id="btn-pt" onclick="setLang('pt')">🇧🇷 PT</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">🇺🇸 EN</button>

      <div class="actions">

      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <div class="list">
        <div class="list-title" id="listTitle"></div>
        <div id="offendersList"></div>
      </div>

      <!-- SIDEBAR -->
      <div class="side">

        <div class="box">

          <ul>
            <li id="fixItem1"></li>
            <li id="fixItem2"></li>
            <li id="fixItem3"></li>
          </ul>
        </div>

        <div class="box">
          <h3 id="boxHistoryTitle"></h3>
          <div id="cleanedLog"></div>
        </div>

        <div class="box">
          <h3 id="boxObfTitle"></h3>
          <p  id="boxObfDesc"></p>
          <input type="password" id="secretInput" class="secret-input" />
          <button class="btn secondary" style="margin-top:10px;width:100%;"

          <p style="margin-top:10px;font-size:12px;" id="boxObfNote"></p>
        </div>

      </div>
    </div>
  </div>

</div><!-- /container -->

let mailbox = structuredClone(initialMailbox);

let cleaned = [
  { domain:'newsletter@americanas.com.br', removed:712, size: 250 * 1024 * 1024 },
  { domain:'ofertas@magazineluiza.com.br', removed:544, size: 190 * 1024 * 1024 },
];

/* =========================================================
   LANGUAGE SWITCH
========================================================= */
function setLang(lang) {
  currentLang = lang;

  // update html lang attribute
  document.getElementById('htmlRoot').lang =
    lang === 'pt' ? 'pt-BR' : lang === 'es' ? 'es' : 'en';

  // toggle active button
  ['pt','en','es'].forEach(l => {
    document.getElementById('btn-' + l).classList.toggle('active', l === lang);
  });

  const t = i18n[lang];

  // static texts
  document.getElementById('subtitleTag').textContent     = t.subtitle;
  document.getElementById('authHeading').textContent     = t.authHeading;
  document.getElementById('authDesc').textContent        = t.authDesc;
  document.getElementById('authLabel').textContent       = t.authLabel;
  document.getElementById('emailPrefix').placeholder     = t.emailPlaceholder;
  document.getElementById('error').textContent           = t.authError;
  document.getElementById('authBtn').textContent         = t.authBtn;
  document.getElementById('resultsHeading').textContent  = t.resultsHeading;
  document.getElementById('btnRefresh').textContent      = t.btnRefresh;
  document.getElementById('btnClean').textContent        = t.btnClean;
  document.getElementById('btnRestore').textContent      = t.btnRestore;
  document.getElementById('statTotal').textContent       = t.statTotal;
  document.getElementById('statTotalSize').textContent   = t.statTotalSize;
  document.getElementById('statTopOffendersCount').textContent = t.statTopOffendersCount;
  document.getElementById('statTopOffendersSize').textContent  = t.statTopOffendersSize;
  document.getElementById('listTitle').textContent       = t.listTitle;
  document.getElementById('boxFixTitle').textContent     = t.boxFixTitle;
  document.getElementById('fixItem1').textContent        = t.fixItem1;
  document.getElementById('fixItem2').textContent        = t.fixItem2;
  document.getElementById('fixItem3').textContent        = t.fixItem3;
  document.getElementById('boxHistoryTitle').textContent = t.boxHistoryTitle;
  document.getElementById('boxObfTitle').textContent     = t.boxObfTitle;
  document.getElementById('boxObfDesc').textContent      = t.boxObfDesc;
  document.getElementById('secretInput').placeholder     = t.secretPlaceholder;
  document.getElementById('btnObfuscate').textContent    = t.btnObfuscate;
  document.getElementById('boxObfNote').textContent      = t.boxObfNote;

  // re-render dynamic content if results are visible
  if (document.getElementById('results').style.display === 'block') {
    render();
  }
}

/* =========================================================
   HELPERS
========================================================= */
function t(key, ...args) {
  const val = i18n[currentLang][key];
  return typeof val === 'function' ? val(...args) : val;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.toastTimeout);
  window.toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

function format(n) {
  return Number(n).toLocaleString(
    currentLang === 'pt' ? 'pt-BR' :
    currentLang === 'es' ? 'es-ES' : 'en-US'
  );
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function categoryLabel(cat) {
  return i18n[currentLang].categories[cat] || cat;
}

/* =========================================================
   START APP
========================================================= */
function startApp() {
  const prefix = document.getElementById('emailPrefix').value.trim();
  const ok = /^[a-zA-Z0-9._%+-]{3,}$/.test(prefix);
  document.getElementById('error').classList.toggle('show', !ok);
  if (!ok) return;

  currentEmail = prefix + '@gmail.com';
  document.getElementById('auth').style.display    = 'none';
  document.getElementById('results').style.display = 'block';
  render();
}

/* =========================================================
   ACTIVE TOP 10
========================================================= */
function activeTop() {
  return mailbox
    .filter(x => x.count > 0)
    .sort((a, b) => b.count - a.count)
    .slice(0, 10);
}

/* =========================================================
   RENDER
========================================================= */
function render() {
  const top      = activeTop();
  const topCount = top[0]?.count || 0;

  const totalEmails = mailbox.reduce((s, o) => s + o.count, 0);
  const totalSize   = mailbox.reduce((s, o) => s + o.size, 0);
  const top10Emails = top.reduce((s, o) => s + o.count, 0);
  const top10Size   = top.reduce((s, o) => s + o.size, 0);

  document.getElementById('subtext').textContent               = t('subtext', currentEmail);
  document.getElementById('totalEmails').textContent           = format(totalEmails);
  document.getElementById('totalSize').textContent             = formatSize(totalSize);
  document.getElementById('topOffendersCount').textContent     = format(top10Emails);
  document.getElementById('topOffendersSize').textContent      = formatSize(top10Size);

  // offenders list
  const list = document.getElementById('offendersList');
  list.innerHTML = '';

  top.forEach((item, index) => {
    const width = Math.max(8, (item.count / topCount) * 100);
    const row   = document.createElement('div');
    row.className = 'offender';
    row.innerHTML = `
      <div class="rank ${index===0?'r1':index===1?'r2':index===2?'r3':''}">
        ${index + 1}
      </div>
      <div>
        <div class="domain">${escapeHtml(item.domain)}</div>
        <div class="cat">${escapeHtml(categoryLabel(item.category))}</div>
      </div>
      <div class="count">
        ${format(item.count)}
        <small>${t('emails')} • ${formatSize(item.size)}</small>
      </div>
      <div class="bar"><i style="width:${width}%"></i></div>
    `;
    list.appendChild(row);
  });

  // cleaned log
  const cleanedLog = document.getElementById('cleanedLog');
  cleanedLog.innerHTML = cleaned.map(x => `
    <div class="cleaned-item">
      <strong>${escapeHtml(x.domain)}</strong>
      <span class="cleaned-removed">${t('cleaned', format(x.removed), formatSize(x.size))}</span>
    </div>
  `).join('');
}

/* =========================================================
   CLEAN TOP OFFENDER
========================================================= */
function cleanTop() {
  const top10 = activeTop();
  if (top10.length === 0) { toast(t('toastNoOffender')); return; }

  top10.forEach(top => {
    cleaned.push({ domain: top.domain, removed: top.count, size: top.size });
    mailbox = mailbox.map(item =>
      item.domain === top.domain ? { ...item, count: 0, size: 0 } : item
    );
  });

  render();
  toast(t('toastCleaned'));
}

/* =========================================================
   REFRESH MAILBOX
========================================================= */
function refreshMailbox() {
  mailbox = mailbox.map(item => {
    if (item.count <= 0) return item;
    const delta = Math.floor(Math.random() * 25) - 8;
    const deltaSize = delta * 150 * 1024; // avg 150KB per email
    return { 
      ...item, 
      count: Math.max(1, item.count + delta),
      size: Math.max(1024, item.size + deltaSize)
    };
  });
  render();
  toast(t('toastRefreshed'));
}

/* =========================================================
   RESTORE DEMO
========================================================= */
function restoreDemo() {
  mailbox = structuredClone(initialMailbox);
  cleaned = [
    { domain:'newsletter@americanas.com.br', removed:712, size: 250 * 1024 * 1024 },
    { domain:'ofertas@magazineluiza.com.br', removed:544, size: 190 * 1024 * 1024 },
  ];
  render();
  toast(t('toastRestored'));
}

/* =========================================================
   OBFUSCATION — XOR + BLAKE2b
========================================================= */
const XOR_KEY = 'BeSafe_X0r_2026';

function xorTransform(input, key) {
  let out = '';
  for (let i = 0; i < input.length; i++) {
    out += String.fromCharCode(input.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return out;
}

function randomSalt(size = 32) {
  const bytes = crypto.getRandomValues(new Uint8Array(size));
  return Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('');
}

function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('');
}

function blake2bHash(input) {
  const encoded = new TextEncoder().encode(input);
  const hash    = blake2b(encoded, null, 64);
  return bytesToHex(hash);
}

function protectSensitiveData() {
  const value = document.getElementById('secretInput').value;
  if (!value) { toast(t('toastNoValue')); return; }

  const salt     = randomSalt();
  const xorValue = btoa(xorTransform(value, XOR_KEY));
  const xorSalt  = btoa(xorTransform(salt,  XOR_KEY));
  const combined = xorValue + xorSalt;
  const finalHash = blake2bHash(combined);

  const payload = {
    algorithm: 'blake2b(xor(value)+xor(salt))',
    xor_data:  xorValue,
    xor_salt:  xorSalt,
    final_hash: finalHash,
    created_at: new Date().toISOString(),
  };

  sessionStorage.setItem('secure_payload', JSON.stringify(payload));
  document.getElementById('secretOutput').textContent = JSON.stringify(payload, null, 2);
  toast(t('toastObfuscated'));
}

/* =========================================================
   INIT — apply default language on page load
========================================================= */
setLang('pt');

</script>
